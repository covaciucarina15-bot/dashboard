<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard live</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#03040a;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(1px 1px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 30% 70%,#fff6,transparent),radial-gradient(1.5px 1.5px at 55% 15%,#fff9,transparent),radial-gradient(1px 1px at 75% 45%,#fff5,transparent),radial-gradient(1px 1px at 90% 85%,#fff7,transparent),radial-gradient(1px 1px at 45% 90%,#fff5,transparent),radial-gradient(1.5px 1.5px at 85% 10%,#fff8,transparent),radial-gradient(1px 1px at 20% 50%,#fff4,transparent),radial-gradient(1px 1px at 65% 60%,#fff6,transparent),
radial-gradient(ellipse 60% 40% at 80% 20%,#1d1a4a55,transparent),radial-gradient(ellipse 50% 40% at 15% 85%,#3a1a2a44,transparent),#03040a;background-size:300px 300px,250px 250px,400px 400px,350px 350px,280px 280px,320px 320px,450px 450px,220px 220px,380px 380px,100% 100%,100% 100%,100% 100%}
.side{position:fixed;left:0;top:0;bottom:0;width:104px;padding:14px 10px;display:flex;flex-direction:column;gap:12px;background:#05060ccc;border-right:1px solid #ffffff10;z-index:5;overflow-y:auto}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1;border-radius:12px;background:#11131c;border:1px solid #ffffff14;color:#cfd3dc;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.5px}
.nb svg{width:26px;height:26px;fill:none;stroke:#ff8a1f;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb:hover{border-color:#ff8a1f88}.nb.act{background:#1d1f2b;border-color:#ff8a1f;color:#fff}.nb.off{opacity:.45;cursor:default}
main{margin-left:104px;padding:14px 18px 40px}
.bar{margin:22px 0 12px;padding:11px;border-radius:12px;background:#0d0f17e6;border:1px solid #ffffff12;color:#ff8a1f;text-align:center;font-size:16px;letter-spacing:2px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{position:relative;background:#12141dcc;border:1px solid #ffffff12;border-radius:12px;height:100px;padding:8px 10px;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.tile:hover{border-color:#ff8a1f66}
.st{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;text-align:center;gap:0}
.st-title{font-weight:800;font-size:14px;color:#fff;letter-spacing:.2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.st-price{font-weight:700;font-size:26px;color:#fff;line-height:1.15;margin:5px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.4px;padding:0 3px;border-radius:4px;transition:background .2s,color .2s}
.st-price.flash-up{background:#22ab9466;color:#fff}
.st-price.flash-down{background:#f2364566;color:#fff}
.st-price.long{font-size:22px}
.st-chg{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;line-height:1.2;color:#8a8f9c}
.st-chg.up{color:#22ab94}
.st-chg.down{color:#f23645}
.st-chg svg{width:11px;height:11px;flex:0 0 11px}
.tape{position:relative;border-radius:12px;background:#0d0f17e6;border:1px solid #ffffff12;overflow:hidden}
.tape::after{content:"";position:absolute;top:0;right:0;bottom:0;width:44px;background:#0d0f17;pointer-events:auto;z-index:3}
.cal{background:#12141dcc;border:1px solid #ffffff12;border-radius:12px;padding:6px}
.note{color:#8a8f9c;font-size:12px;text-align:center;margin-top:24px}
@media(max-width:700px){
  .side{top:auto;width:auto;right:0;flex-direction:row;padding:6px;gap:6px;overflow-x:auto}
  .nb{min-width:64px;font-size:8px}.nb svg{width:20px;height:20px}
  main{margin-left:0;padding:10px 10px 90px}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .tile{height:96px}
  .st-price{font-size:22px}
  .st-price.long{font-size:18px}
}
</style>
</head>
<body>
<nav class="side"><a class="nb act" href="#top"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>DASHBOARD</span></a><a class="nb" href="#crypto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 7.5v9M9.5 8h4a2 2 0 010 4h-4m0 0h4.5a2 2 0 010 4H9.5M11 6v2m0 8v2"/></svg><span>CRYPTO</span></a><a class="nb" href="#indici"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/><path d="M15 6h4v4"/></svg><span>STOCKS</span></a><a class="nb" href="#calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>CALENDAR</span></a><a class="nb off" title="În curând"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/></svg><span>PORTOFOLIU</span></a><a class="nb off" title="În curând"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>UPDATE</span></a></nav>

="bar">OBLIGAȚIUNI</h2><div class="grid"><div class="tile"><div class="st" data-src="fh" data-sym="TLT" data-name="TLT" data-kind="px2"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="TVC:US02Y" data-name="US02Y" data-kind="yield"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="TVC:US10Y" data-name="US10Y" data-kind="yield"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div></div></section><section id="marfuri"><h2 class="bar">MĂRFURI</h2><div class="grid"><div class="tile"><div class="st" data-src="tv" data-sym="OANDA:XAUUSD" data-name="Aur" data-kind="px2"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="TVC:SILVER" data-name="Argint" data-kind="px3"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="NYMEX:CL1!" data-name="Petrol WTI" data-kind="px2"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="NYMEX:BZ1!" data-name="Brent" data-kind="px2"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div></div></section><section id="etf"><h2 class="bar">ETF CRYPTO</h2><div class="grid"><div class="tile"><div class="st" data-src="fh" data-sym="IBIT" data-name="ETF BTC (IBIT)" data-kind="px2"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="fh" data-sym="ETHA" data-name="ETF ETH (ETHA)" data-kind="px2"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div></div></section><section id="crypto"><h2 class="bar">CRYPTO</h2><div class="grid"><div class="tile"><div class="st" data-src="tv" data-sym="BITSTAMP:BTCUSD" data-name="BTC/USD" data-kind="px2"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="BITSTAMP:ETHUSD" data-name="ETH/USD" data-kind="px2"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="CRYPTOCAP:BTC.D" data-name="BTC.D" data-kind="dom"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="CRYPTOCAP:ETH.D" data-name="ETH.D" data-kind="dom"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="CRYPTOCAP:USDT.D" data-name="USDT.D" data-kind="dom"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div><div class="tile"><div class="st" data-src="tv" data-sym="CRYPTOCAP:TOTAL3" data-name="TOTAL3" data-kind="total"><div class="st-title"></div><div class="st-price">—</div><div class="st-chg"></div></div></div></div></section>

</main>
<script>
(function(){
var KEY="dbrijthr01qvp4idcqn0dbrijthr01qvp4idcqng";
var ARU='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.2L10.5 9.3H1.5Z" fill="currentColor"/></svg>';
var ARD='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 9.8L1.5 2.7h9Z" fill="currentColor"/></svg>';

document.querySelectorAll(".st").forEach(function(el){
  el.querySelector(".st-title").textContent=el.dataset.name;
});

function roAbs(n,frac){
  var parts=Math.abs(n).toFixed(frac).split(".");
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return parts.length>1?parts[0]+","+parts[1]:parts[0];
}
function roSigned(n,frac){
  var s=roAbs(n,frac);
  if(n>0)return "+"+s;
  if(n<0)return "-"+s;
  return s;
}
function compact(n){
  var a=Math.abs(n),sign=n<0?"-":(n>0?"+":""),v,suf;
  if(a>=1e12){v=a/1e12;suf="T";}
  else if(a>=1e9){v=a/1e9;suf="B";}
  else if(a>=1e6){v=a/1e6;suf="M";}
  else return null;
  return sign+roAbs(v,2)+suf;
}
function decimals(kind){
  if(kind==="fx5")return 5;
  if(kind==="fx3"||kind==="yield"||kind==="px3")return 3;
  if(kind==="dxy")return 3;
  return 2;
}
function fmtPrice(n,kind){
  if(n==null||isNaN(n))return "—";
  if(kind==="dom")return roAbs(n,2)+"%";
  if(kind==="total"){
    var c=compact(n);
    return c?c.replace(/^\+/,""):roAbs(n,0);
  }
  return roAbs(n,decimals(kind));
}
function fmtAbs(n,kind){
  if(n==null||isNaN(n))return "—";
  if(kind==="total"||Math.abs(n)>=1e6){
    var c=compact(n);
    if(c)return c;
  }
  return roSigned(n,decimals(kind)==="fx5"?5:Math.min(decimals(kind),2));
}
/* fix typo above: decimals() returns number, not string. redefined below in apply. */

function fmtAbs2(n,kind){
  if(n==null||isNaN(n))return "—";
  if(kind==="total"||Math.abs(n)>=1e6){
    var c=compact(n);
    if(c)return c;
  }
  var f=decimals(kind);
  if(f>2&&kind!=="yield")f=2;
  if(kind==="fx5")f=5;
  if(kind==="fx3")f=3;
  return roSigned(n,f);
}

function render(el,price,chg,pct,doFlash){
  var kind=el.dataset.kind;
  var priceEl=el.querySelector(".st-price");
  var chgEl=el.querySelector(".st-chg");
  var old=el._last;
  var txt=fmtPrice(price,kind);
  priceEl.textContent=txt;
  priceEl.classList.toggle("long",txt.length>=11);
  if(pct==null||isNaN(pct)||chg==null||isNaN(chg)){
    chgEl.className="st-chg";
    chgEl.innerHTML="";
  }else{
    var up=pct>0||(pct===0&&chg>0);
    var down=pct<0||(pct===0&&chg<0);
    chgEl.className="st-chg"+(up?" up":down?" down":"");
    var line=fmtAbs2(chg,kind)+" ("+roSigned(pct,2)+"%)";
    chgEl.innerHTML=line+" "+(up?ARU:down?ARD:"");
  }
  if(doFlash&&old!=null&&price!=null&&Number(price)!==Number(old)){
    priceEl.classList.remove("flash-up","flash-down");
    void priceEl.offsetWidth;
    priceEl.classList.add(Number(price)>Number(old)?"flash-up":"flash-down");
    setTimeout(function(){priceEl.classList.remove("flash-up","flash-down");},450);
  }
  el._last=price;
  if(el.dataset.src==="fh"&&price!=null){
    /* pc stored separately */
  }
}

/* TradingView public scanner — one batched POST, text/plain avoids CORS preflight */
var tvTiles=[].slice.call(document.querySelectorAll('.st[data-src="tv"]'));
var tvMap={};
tvTiles.forEach(function(el){tvMap[el.dataset.sym]=el;});
var tvTickers=tvTiles.map(function(el){return el.dataset.sym;});

function pollTV(){
  return fetch("https://scanner.tradingview.com/global/scan",{
    method:"POST",
    body:JSON.stringify({symbols:{tickers:tvTickers,query:{typespecs:[]}},columns:["close","change","change_abs"]})
  }).then(function(r){return r.json();}).then(function(data){
    (data.data||[]).forEach(function(row){
      var el=tvMap[row.s];
      if(!el||!row.d)return;
      render(el,row.d[0],row.d[2],row.d[1],true);
    });
  }).catch(function(){});
}

/* Finnhub live for TLT, IBIT, ETHA */
var fhTiles=[].slice.call(document.querySelectorAll('.st[data-src="fh"]'));
var fhState={};
fhTiles.forEach(function(el){fhState[el.dataset.sym]={pc:null,el:el};});

function applyFHQuote(sym,q){
  if(!q||q.c==null||(q.c===0&&!q.pc))return;
  var st=fhState[sym];if(!st)return;
  st.pc=q.pc;
  var d=q.d,dp=q.dp;
  if((d==null||dp==null)&&q.pc){d=q.c-q.pc;dp=q.pc?(d/q.pc)*100:0;}
  render(st.el,q.c,d,dp,true);
}
function applyFHTrade(sym,p){
  var st=fhState[sym];if(!st)return;
  if(st.pc==null){render(st.el,p,null,null,true);return;}
  var d=p-st.pc,dp=st.pc?(d/st.pc)*100:0;
  render(st.el,p,d,dp,true);
}
function pollFH(){
  fhTiles.forEach(function(el){
    var sym=el.dataset.sym;
    fetch("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(sym)+"&token="+encodeURIComponent(KEY))
      .then(function(r){return r.json();})
      .then(function(q){applyFHQuote(sym,q);})
      .catch(function(){});
  });
}
var fhBackoff=2000;
function connectFH(){
  var ws=new WebSocket("wss://ws.finnhub.io?token="+encodeURIComponent(KEY));
  ws.onopen=function(){
    fhBackoff=2000;
    fhTiles.forEach(function(el){ws.send(JSON.stringify({type:"subscribe",symbol:el.dataset.sym}));});
  };
  ws.onmessage=function(ev){
    var msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
    if(msg.type==="trade"&&msg.data){
      msg.data.forEach(function(t){if(t&&t.s&&t.p!=null)applyFHTrade(t.s,t.p);});
    }
  };
  ws.onclose=function(){
    setTimeout(connectFH,fhBackoff);
    fhBackoff=Math.min(fhBackoff*2,60000);
  };
}

pollTV();
pollFH();
connectFH();
setInterval(function(){pollTV();pollFH();},15000);
})();
</script>
</body>
</html>
