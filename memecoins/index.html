<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#01050F">
<meta name="robots" content="noindex">
<title>Analize memecoinuri bigcaps (live)</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#01050F;color:#C9D4E8;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 700px at 0% -10%,rgba(46,76,226,.22),transparent 60%),radial-gradient(900px 600px at 110% 0%,rgba(27,59,126,.3),transparent 60%),#01050F;min-height:100vh}
a{color:#94C0FD}
#root{max-width:1280px;margin:0 auto;padding:12px 12px 64px}
.gc-head{padding:6px 2px 14px}
.gc-title{margin:0 0 6px;font-size:28px;line-height:34px;font-weight:800;color:#fff;letter-spacing:-.02em}
.gc-summary{margin:0;color:#8B95A8;font-size:15px;line-height:22px;max-width:980px}
.gc-section{margin:34px 0 0;scroll-margin-top:84px}
.gc-h2{margin:0 0 4px;font-size:24px;line-height:30px;color:#fff;font-weight:800;letter-spacing:-.01em}
.gc-caption{margin:0 0 14px;color:#8B95A8;font-size:15px}
.gc-text{color:#8B95A8;font-size:14.5px;line-height:22px;margin:12px 0 0}
.gc-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:rgba(148,192,253,.1);border:1px solid rgba(148,192,253,.18);border-radius:6px;padding:1px 5px;word-break:break-all}
.gc-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gc-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.gc-table th{position:sticky;top:0;background:#061027;color:#94C0FD;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:10px 10px;white-space:nowrap;border-bottom:1px solid rgba(148,192,253,.2)}
.gc-table td{padding:10px 10px;border-bottom:1px solid rgba(148,192,253,.08);vertical-align:middle;color:#C9D4E8}
.gc-table td:first-child,.gc-table th:first-child{position:sticky;left:0;z-index:1;background:#040a1c}
.gc-table th:first-child{z-index:2;background:#061027}
.gc-table tr:hover td{background:rgba(46,76,226,.07)}
.gc-status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid;font-size:12.5px;font-weight:700;white-space:nowrap}
.gc-status-dot{width:7px;height:7px;border-radius:99px}
.gc-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.gc-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8B95A8;font-weight:600}
.gc-input{font:inherit;font-size:15px;color:#fff;background:rgba(1,5,15,.75);border:1px solid rgba(148,192,253,.3);border-radius:12px;padding:9px 11px;min-width:0;width:100%}
.gc-input:focus{outline:2px solid #2E4CE2;outline-offset:1px}
.gc-seg{display:inline-flex;flex-wrap:wrap;gap:6px;padding:4px;border-radius:14px;background:rgba(1,5,15,.6);border:1px solid rgba(148,192,253,.2)}
.gc-seg-btn{font:inherit;font-size:13.5px;font-weight:700;color:#C9D4E8;background:transparent;border:0;border-radius:10px;padding:7px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.gc-seg-btn.on{background:linear-gradient(135deg,#2E4CE2,#1B3B7E);color:#fff;box-shadow:0 0 14px rgba(46,76,226,.45)}
.gc-seg-n{font-size:11.5px;opacity:.8}
.gc-grid{display:grid;grid-template-columns:repeat(var(--gc-cols),minmax(0,1fr))}
@media (max-width:760px){.gc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gc-title{font-size:23px;line-height:29px}.gc-h2{font-size:21px}}
@media (max-width:460px){.gc-grid{grid-template-columns:1fr}}
.gc-table .mb-ca{max-width:none}.gc-table .mb-ca-txt{word-break:normal;white-space:nowrap}
/* live */
.lv-panel{padding:16px;margin:4px 0 18px;border-color:rgba(92,255,176,.3)!important}
.lv-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.lv-title{font-size:22px;font-weight:800;color:#fff;margin-top:2px}
.lv-sub{font-size:13px;color:#8B95A8}
.lv-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lv-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid rgba(148,192,253,.25);background:rgba(1,5,15,.6);font-size:13px;color:#C9D4E8;white-space:nowrap;font-variant-numeric:tabular-nums}
.lv-dot{width:10px;height:10px;border-radius:50%;background:#5CFFB0;box-shadow:0 0 10px #5CFFB0;animation:lvp 2s infinite}
.lv-dot.load{background:#E8C547;box-shadow:0 0 10px #E8C547}.lv-dot.err{background:#FF8A8A;box-shadow:0 0 10px #FF8A8A}
@keyframes lvp{50%{opacity:.4}}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lv-card{all:unset;box-sizing:border-box;display:block;cursor:pointer;position:relative;padding:12px 13px;border-radius:16px;border:1px solid rgba(92,255,176,.3);background:linear-gradient(160deg,rgba(92,255,176,.08),rgba(46,76,226,.1));color:#C9D4E8}
.lv-card:hover{border-color:#5CFFB0}
.lv-card.new{border-color:#E8C547;box-shadow:0 0 0 1px #E8C547,0 0 22px rgba(232,197,71,.25)}
.lv-badge{position:absolute;top:10px;right:10px;background:#E8C547;color:#1b1500;font-weight:800;font-size:10.5px;padding:2px 7px;border-radius:999px}
.lv-sym{font-weight:800;color:#fff;font-size:16px;padding-right:44px}.lv-nm{font-size:12px;color:#8B95A8;font-weight:500}
.lv-big{font-size:22px;font-weight:800;color:#5CFFB0;font-variant-numeric:tabular-nums;margin:2px 0}
.lv-kv{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;font-variant-numeric:tabular-nums}.lv-kv b{color:#fff}
.lv-narr{font-size:12px;color:#8B95A8;margin-top:6px;line-height:17px}
.lv-empty{color:#8B95A8;font-size:14px;padding:4px 2px}
.lv-errs{margin-top:10px;font-size:12.5px;color:#FF8A8A}
.lv-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}.lv-add .gc-input{flex:1 1 260px;width:auto}
.lv-manual{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lv-x{all:unset;cursor:pointer;color:#FF8A8A;font-weight:800;padding:0 2px}
.lv-detail{padding:14px;margin:0 0 16px;border-radius:16px;border:1px solid rgba(92,255,176,.25);background:rgba(92,255,176,.04)}
.lv-dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px 16px}
.lv-dv{font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
.lv-links{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:14px;font-weight:700}
.lv-foot{color:#8B95A8;font-size:12.5px;text-align:center;padding:18px 8px 0}
noscript{display:block;padding:20px;color:#FF8A8A}
</style>
